<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Samir &amp; Renad - Engagement</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg-dark:#121d12; --bg-mid:#1a2a1a; --bg-glow:#34472f;
  --cream:#f1e6d0; --leaf:#8aa57a; --leaf-dark:#3f5a3a; --leaf-deep:#1f3d24;
  --w:min(calc(100vw - 96px),440px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(circle at 25% 20%,var(--bg-glow) 0%,var(--bg-mid) 55%,var(--bg-dark) 100%) fixed;
  color:var(--cream);
  font-family:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px 12px;overflow-x:hidden;
}
.popup{
  width:calc(var(--w) + 44px);
  background:var(--leaf-dark);border:4px solid var(--cream);box-shadow:8px 8px 0 #000;
  padding:24px 18px 22px;text-align:center;animation:pop .5s ease-out;
}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
h1{font-size:clamp(11px,3.4vw,18px);line-height:1.6;margin:0 0 12px;color:var(--cream);text-shadow:3px 3px 0 #000}
p.msg{font-size:clamp(8px,2.4vw,11px);line-height:1.9;margin:0 0 22px;color:var(--cream)}
p.tap{font-size:9px;line-height:1.8;margin:18px 0 0;color:var(--leaf);transition:opacity .4s}

.stage{transition:margin-top .6s ease}
.stage.open{margin-top:calc(var(--w) * 0.52)}
.env{position:relative;width:var(--w);aspect-ratio:1456/909;margin:0 auto}
.layer{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}

/* the original envelope photo, untouched, shown until the seal is clicked */
.full{z-index:20}
.stage.open .full{visibility:hidden}

/* the same photo cut into body + flap, used for the opening animation */
#rig{position:absolute;left:0;top:0;width:100%;height:100%;perspective:1200px;visibility:hidden;z-index:1}
.stage.open #rig{visibility:visible}
.inside{z-index:1;background:linear-gradient(#0f1d12,#1a2e1d)}
.body{z-index:3}
.flap{z-index:5;transform-origin:50% 0;transform-style:preserve-3d;will-change:transform}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{transform:rotateX(180deg);background:linear-gradient(#2a452e,#1b3120)}
.stage.open .flap{animation:flip 1s ease-in-out forwards}
@keyframes flip{
  0%{transform:rotateX(0deg);z-index:5}
  49%{z-index:5}
  50%{z-index:0}
  100%{transform:rotateX(180deg);z-index:0}
}

/* the invitation paper: it can rise upward but is cut off at the bottom edge of the envelope */
#cardwrap{
  position:absolute;left:0;top:0;width:100%;height:100%;z-index:2;pointer-events:none;
  clip-path:inset(-300% -50% 0 -50%);
}
#card{
  position:absolute;left:8%;top:30%;width:84%;height:auto;aspect-ratio:1241/1748;display:block;
  box-shadow:0 0 14px rgba(0,0,0,.45);will-change:transform;
  transform:translateY(0);transition:transform 1.1s cubic-bezier(.2,.8,.2,1) .9s;
}
.stage.open #card{transform:translateY(-46%)}

/* invisible click area over the beige seal */
#seal{
  position:absolute;left:50%;top:56.77%;width:calc(var(--w) * .2);height:calc(var(--w) * .2);
  transform:translate(-50%,-50%);border-radius:50%;
  background:transparent;border:0;padding:0;margin:0;cursor:pointer;z-index:30;
  -webkit-tap-highlight-color:transparent;
}
#seal:focus{outline:none}
#seal:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
.stage.open #seal{display:none}

/* ---------- final invitation view (same page, so the change is seamless) ---------- */
#finalbg{
  position:fixed;inset:0;z-index:80;opacity:0;visibility:hidden;transition:opacity .6s ease;
  background:radial-gradient(circle at 25% 20%,var(--bg-glow) 0%,var(--bg-mid) 55%,var(--bg-dark) 100%);
}
#finalbg.on{opacity:1;visibility:visible}
#final{
  --iw:max(200px,min(calc(100vw - 24px),calc((100vh - 190px) * 0.71),640px));
  position:fixed;inset:0;z-index:90;overflow-y:auto;overflow-x:hidden;visibility:hidden;
  display:flex;flex-direction:column;align-items:center;padding:12px 12px 28px;
}
#final.on{visibility:visible}

.count{width:var(--iw);margin:4px 0 16px;text-align:center;opacity:0;transition:opacity .6s ease}
.count .cap{font-size:clamp(8px,2.3vw,10px);line-height:1.7;color:var(--leaf);margin:0 0 10px}
.units{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.unit{background:var(--leaf-dark);border:3px solid var(--cream);box-shadow:4px 4px 0 #000;padding:10px 2px 8px}
.unit b{display:block;font-weight:normal;font-size:clamp(14px,4.6vw,24px);line-height:1;color:var(--cream);text-shadow:2px 2px 0 #000}
.unit span{display:block;margin-top:8px;font-size:clamp(6px,1.7vw,8px);color:var(--leaf)}

.paper{width:var(--iw);aspect-ratio:1241/1748;display:block;box-shadow:0 0 14px rgba(0,0,0,.45);will-change:transform}

.actions{width:var(--iw);display:flex;gap:14px;margin-top:20px;opacity:0;transition:opacity .6s ease .15s}
#final.ready .count,#final.ready .actions{opacity:1}
.btn{
  flex:1;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;
  font:inherit;font-size:clamp(9px,2.6vw,11px);line-height:1.7;padding:16px 8px;
  border:4px solid #000;box-shadow:5px 5px 0 #000;cursor:pointer;
  background:var(--cream);color:var(--leaf-deep);
}
.btn.alt{background:var(--leaf-dark);color:var(--cream);border-color:var(--cream)}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #000}
@media (max-width:520px){.actions{flex-direction:column}}
</style>
</head>
<body>
<div class="popup">
  <h1>Congratulations!</h1>
  <p class="msg">You have won an invitation to our engagement celebration</p>

  <div class="stage" id="stage">
    <div class="env" role="img" aria-label="Wedding invitation envelope">
      <div id="rig">
        <div class="layer inside"></div>
        <div id="cardwrap"><img id="card" alt=""></div>
        <img class="layer body envimg" id="body" alt="">
        <div class="layer flap">
          <img class="layer face front envimg" id="front" alt="">
          <div class="layer face back" id="back"></div>
        </div>
      </div>
      <img class="layer full envimg" alt="">
      <button id="seal" type="button" aria-label="Open the envelope"></button>
    </div>
  </div>

  <p class="tap" id="tap">Tap the seal to open</p>
</div>

<div id="finalbg"></div>
<div id="final">
  <div class="count">
    <p class="cap" id="cdCap">COUNTING DOWN TO 26.11.2026</p>
    <div class="units" id="units">
      <div class="unit"><b id="cdD">00</b><span>DAYS</span></div>
      <div class="unit"><b id="cdH">00</b><span>HOURS</span></div>
      <div class="unit"><b id="cdM">00</b><span>MINUTES</span></div>
      <div class="unit"><b id="cdS">00</b><span>SECONDS</span></div>
    </div>
  </div>

  <img class="paper" id="paper" alt="Samir and Renad engagement invitation">

  <div class="actions">
    <a class="btn alt" id="loc" target="_blank" rel="noopener">VIEW LOCATION</a>
    <a class="btn" id="confirm" target="_blank" rel="noopener">CONFIRM YOUR PRESENCE</a>
  </div>
</div>

<script>
/* 1) Location button: paste the Google Maps link of the venue here.
      Until then it searches Google Maps for the venue name. */
const LOCATION_URL = 'https://maps.app.goo.gl/HSa8onFKqatjFx9S8';

/* 2) Confirm button opens WhatsApp. Put the number that should receive the confirmations,
      with the country code and no + or leading zero (Egypt example: 201012345678).
      If left empty, WhatsApp opens and the guest picks who to send it to. */
const CONFIRM_NUMBER = '+20 11 19956370';
const CONFIRM_TEXT = 'Hello, I confirm my presence at Samir & Renad’s engagement on 26.11.2026.';

/* 3) Countdown target: 26 Nov 2026, 5:30 PM Egypt time (same moment for everyone) */
const TARGET = new Date('2026-11-26T17:30:00+02:00').getTime();

document.getElementById('loc').href = LOCATION_URL;
document.getElementById('confirm').href =
  'https://wa.me/' + CONFIRM_NUMBER + '?text=' + encodeURIComponent(CONFIRM_TEXT);

/* ---------- countdown ---------- */
const two = n => String(n).padStart(2, '0');
function tick() {
  const diff = TARGET - Date.now();
  if (diff <= 0) {
    document.getElementById('units').style.display = 'none';
    document.getElementById('cdCap').textContent = 'THE DAY HAS ARRIVED';
    return;
  }
  const s = Math.floor(diff / 1000);
  document.getElementById('cdD').textContent = two(Math.floor(s / 86400));
  document.getElementById('cdH').textContent = two(Math.floor(s % 86400 / 3600));
  document.getElementById('cdM').textContent = two(Math.floor(s % 3600 / 60));
  document.getElementById('cdS').textContent = two(s % 60);
}
tick();
setInterval(tick, 1000);

/* ---------- find the images even if the file extension is slightly different ---------- */
function firstThatLoads(list, done) {
  let i = 0;
  const probe = new Image();
  probe.onload = () => done(list[i]);
  probe.onerror = () => { if (++i < list.length) probe.src = list[i]; };
  probe.src = list[0];
}
firstThatLoads(['envelope.jpg', 'envelope.jpeg', 'envelope.jpg.jpeg', 'envelope.JPG', 'envelope.png'],
  src => document.querySelectorAll('.envimg').forEach(el => { el.src = src; }));
firstThatLoads(['invitation.png', 'invitation.jpg', 'invitation.jpeg', 'invitation.png.png', 'Samir___Renad_engagment_invitation_new_.png'],
  src => { document.getElementById('card').src = src; document.getElementById('paper').src = src; });

/* ---------- cut the envelope photo into flap and body (numbers are pixels of the original photo) ---------- */
const IW = 1456, IH = 909, CX = 728, CY = 516, R = 150, LY0 = 111, LM = 0.647;
(function cut() {
  const a = 1 + LM * LM, b = -2 * CX + 2 * LM * (LY0 - CY), c = CX * CX + (LY0 - CY) ** 2 - R * R;
  const xL = (-b - Math.sqrt(b * b - 4 * a * c)) / (2 * a), yL = LY0 + LM * xL, xR = IW - xL;
  let a0 = Math.atan2(yL - CY, xL - CX); if (a0 < 0) a0 += 2 * Math.PI;
  const a1 = Math.atan2(yL - CY, xR - CX), N = 16, arc = [];
  for (let i = 0; i <= N; i++) {
    const t = a0 + (a1 - a0) * i / N;
    arc.push([CX + R * Math.cos(t), CY + R * Math.sin(t)]);
  }
  const poly = pts => 'polygon(' + pts.map(p => (p[0] / IW * 100).toFixed(3) + '% ' + (p[1] / IH * 100).toFixed(3) + '%').join(',') + ')';
  const body = [[0, LY0], ...arc, [IW, LY0], [IW, IH], [0, IH]];
  const flap = [[0, 0], [IW, 0], [IW, LY0], ...arc.slice().reverse(), [0, LY0]];
  const back = flap.map(p => [p[0], IH - p[1]]);
  document.getElementById('body').style.clipPath = poly(body);
  document.getElementById('front').style.clipPath = poly(flap);
  document.getElementById('back').style.clipPath = poly(back);
})();

/* ---------- the paper glides from the envelope to its final place on the same page ---------- */
function reveal() {
  const card = document.getElementById('card'), env = document.querySelector('.env');
  const paper = document.getElementById('paper'), fin = document.getElementById('final'), bg = document.getElementById('finalbg');
  const r = card.getBoundingClientRect(), e = env.getBoundingClientRect(), f = paper.getBoundingClientRect();
  const k = r.width / f.width;
  const clipBottom = Math.max(0, r.bottom - e.bottom) / k;

  /* put the final paper exactly on top of the paper in the envelope */
  paper.style.transition = 'none';
  paper.style.transformOrigin = '0 0';
  paper.style.transform = 'translate(' + (r.left - f.left) + 'px,' + (r.top - f.top) + 'px) scale(' + k + ')';
  paper.style.clipPath = 'inset(0 0 ' + clipBottom + 'px 0)';
  document.body.style.overflow = 'hidden';
  fin.classList.add('on');
  bg.classList.add('on');
  paper.getBoundingClientRect(); /* make the browser register the starting position */

  /* then let it glide into place */
  const ease = 'cubic-bezier(.65,0,.25,1)';
  paper.style.transition = 'transform 1s ' + ease + ', clip-path 1s ' + ease;
  paper.style.transform = 'none';
  paper.style.clipPath = 'inset(0 0 0px 0)';

  setTimeout(() => { document.querySelector('.popup').style.visibility = 'hidden'; }, 700);
  setTimeout(() => { fin.classList.add('ready'); }, 850);
}

let opened = false;
document.getElementById('seal').addEventListener('click', () => {
  if (opened) return;
  opened = true;
  document.getElementById('stage').classList.add('open');
  document.getElementById('tap').style.opacity = 0;
  setTimeout(reveal, 2400);
});
</script>
</body>
</html>
